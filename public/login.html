<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - KaryaFlow Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #111e47 0%, #060b18 65%, #02040a 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background decorative light spots */
        .ambient-glow-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
        }

        .ambient-glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.16) 0%, transparent 70%);
            bottom: -80px;
            right: -80px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
        }

        /* Modern Glass Card */
        .glass-auth-card {
            max-width: 440px;
            width: 100%;
            background: rgba(15, 26, 54, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
            position: relative;
            z-index: 10;
        }

        .auth-logo {
            height: 52px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            filter: drop-shadow(0 6px 16px rgba(99, 102, 241, 0.5));
            transition: transform 0.3s ease;
        }

        .auth-logo:hover {
            transform: scale(1.04);
        }

        .form-control, .input-group-text {
            background-color: rgba(6, 11, 24, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            border-radius: 10px;
        }

        .form-control:focus {
            background-color: rgba(11, 19, 41, 0.95);
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
            color: #ffffff;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #38bdf8 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            transition: all 0.25s ease;
        }

        .btn-gradient:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 50%, #0ea5e9 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.55);
            color: white;
        }

        .btn-gradient:active {
            transform: translateY(0);
        }

        .quick-pass-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed rgba(16, 185, 129, 0.35);
            border-radius: 10px;
            padding: 0.65rem 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-pass-box:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.6);
        }
    </style>
</head>
<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<div class="glass-auth-card mx-3">
    <!-- Brand Emblem -->
    <div class="text-center mb-4">
        <a href="index.html">
            <img src="img/logo.png" alt="KaryaFlow" class="auth-logo" onerror="this.onerror=null; this.src='https://placehold.co/200x55/0b1329/38bdf8?text=KaryaFlow';">
        </a>
        <h4 class="fw-bold mt-3 mb-1 text-white">Welcome Back</h4>
        <small class="text-muted">Enter any email & password to access your dashboard</small>
    </div>

    <!-- Quick Access Demo Trigger -->
    <div class="quick-pass-box mb-4 d-flex align-items-center justify-content-between" onclick="quickFillAndLogin()">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-lightning-charge-fill text-success fs-5"></i>
            <div>
                <strong class="d-block small text-success">Quick Demo Access</strong>
                <small class="text-muted" style="font-size: 0.75rem;">1-Click autofill & instant login</small>
            </div>
        </div>
        <span class="badge bg-success-subtle text-success border border-success-subtle small px-2 py-1">Instant</span>
    </div>

    <div id="login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <form onsubmit="handleLogin(event)">
        <!-- Email Input -->
        <div class="mb-3">
            <label class="form-label small text-muted fw-semibold">Corporate Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="login-email" class="form-control" placeholder="user@karyaflow.internal" required>
            </div>
        </div>

        <!-- Password Input -->
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small text-muted fw-semibold mb-0">Password</label>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.7rem;">Any Password Accepted</span>
            </div>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock text-muted"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('login-password', this)">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-login" class="btn btn-gradient w-100 py-2 d-flex align-items-center justify-content-center gap-2">
            <span>Sign In to Dashboard</span>
            <i class="bi bi-arrow-right"></i>
        </button>
    </form>

    <!-- Footer Links -->
    <div class="text-center mt-4 border-top border-secondary border-opacity-25 pt-3">
        <small class="text-muted">Don't have an account yet? 
            <a href="signup.html" class="text-primary text-decoration-none fw-semibold ms-1">Create Account</a>
        </small>
    </div>
</div>

<script>
function togglePasswordVisibility(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

function quickFillAndLogin() {
    document.getElementById('login-email').value = 'shranya@karyaflow.internal';
    document.getElementById('login-password').value = 'admin123';
    document.querySelector('form').requestSubmit();
}

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const alertBox = document.getElementById('login-alert');
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';
    alertBox.classList.add('d-none');

    try {
        const res = await fetch('api/auth.php?action=login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
            window.location.href = 'index.html';
        } else {
            alertBox.textContent = data.error || 'Login failed. Please try again.';
            alertBox.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<span>Sign In to Dashboard</span> <i class="bi bi-arrow-right"></i>';
        }
    } catch (err) {
        // Permissive fallback
        window.location.href = 'index.html';
    }
}
</script>
</body>
</html>
