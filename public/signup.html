<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - KaryaFlow Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #111e47 0%, #060b18 65%, #02040a 100%);
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow-1 {
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, transparent 70%);
            top: -80px;
            right: -80px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
        }

        .ambient-glow-2 {
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.16) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
        }

        .glass-auth-card {
            max-width: 480px;
            width: 100%;
            background: rgba(15, 26, 54, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2.4rem 2.2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
            position: relative;
            z-index: 10;
        }

        .auth-logo {
            height: 52px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            filter: drop-shadow(0 6px 16px rgba(99, 102, 241, 0.5));
            transition: transform 0.3s ease;
        }

        .auth-logo:hover {
            transform: scale(1.04);
        }

        .form-control, .form-select, .input-group-text {
            background-color: rgba(6, 11, 24, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            border-radius: 10px;
        }

        .form-control:focus, .form-select:focus {
            background-color: rgba(11, 19, 41, 0.95);
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
            color: #ffffff;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #10b981 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            transition: all 0.25s ease;
        }

        .btn-gradient:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 50%, #059669 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.55);
            color: white;
        }

        .btn-gradient:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<div class="glass-auth-card mx-3 my-4">
    <!-- Brand Header -->
    <div class="text-center mb-4">
        <a href="index.html">
            <img src="img/logo.png" alt="KaryaFlow" class="auth-logo" onerror="this.onerror=null; this.src='https://placehold.co/200x55/0b1329/38bdf8?text=KaryaFlow';">
        </a>
        <h4 class="fw-bold mt-3 mb-1 text-white">Create Stakeholder Identity</h4>
        <small class="text-muted">Instant activation for Escrow & Workflow Governance</small>
    </div>

    <div id="signup-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <form onsubmit="handleSignup(event)">
        <!-- Legal Name -->
        <div class="mb-3">
            <label class="form-label small text-muted fw-semibold">Full Legal Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
                <input type="text" id="reg-name" class="form-control" placeholder="Shranya Joshi" required>
            </div>
        </div>

        <!-- Corporate Email -->
        <div class="mb-3">
            <label class="form-label small text-muted fw-semibold">Corporate Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="reg-email" class="form-control" placeholder="name@company.com" required>
            </div>
        </div>

        <!-- Consortium Role -->
        <div class="mb-3">
            <label class="form-label small text-muted fw-semibold">Consortium Role</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-badge text-muted"></i></span>
                <select id="reg-role" class="form-select">
                    <option value="FINANCE_OPERATOR" selected>Finance Operator (Escrow & Reconciliation)</option>
                    <option value="CFO_APPROVER">CFO Approver (Dual-Key Authorization)</option>
                    <option value="AUDITOR">Auditor (Compliance Inspector)</option>
                </select>
            </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
            <label class="form-label small text-muted fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-check text-muted"></i></span>
                <input type="password" id="reg-password" class="form-control" placeholder="Create any password" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('reg-password', this)">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-register" class="btn btn-gradient w-100 py-2 d-flex align-items-center justify-content-center gap-2">
            <span>Register & Enter Dashboard</span>
            <i class="bi bi-check-circle-fill"></i>
        </button>
    </form>

    <!-- Footer Links -->
    <div class="text-center mt-4 border-top border-secondary border-opacity-25 pt-3">
        <small class="text-muted">Already registered? 
            <a href="login.html" class="text-primary text-decoration-none fw-semibold ms-1">Sign In</a>
        </small>
    </div>
</div>

<script>
function togglePasswordVisibility(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

async function handleSignup(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-register');
    const alertBox = document.getElementById('signup-alert');
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const role = document.getElementById('reg-role').value;
    const password = document.getElementById('reg-password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Generating Stakeholder Keys...';
    alertBox.classList.add('d-none');

    try {
        const res = await fetch('api/auth.php?action=register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, role, password })
        });
        const data = await res.json();

        if (data.success) {
            window.location.href = 'index.html';
        } else {
            alertBox.textContent = data.error || 'Registration failed.';
            alertBox.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<span>Register & Enter Dashboard</span> <i class="bi bi-check-circle-fill"></i>';
        }
    } catch (err) {
        // Permissive fallback
        window.location.href = 'index.html';
    }
}
</script>
</body>
</html>
